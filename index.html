<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personeelsfeest</title>
<meta name="theme-color" content="#1e2023">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personeelsfeest">
<meta name="description" content="Afvinklijst voor de dag van het personeelsfeest: mee te nemen, opbouw, helpers en afsluiten.">
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url("fonts/Barlow-Regular.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-weight: 500 600; font-display: swap; src: url("fonts/Barlow-Medium.ttf") format("truetype"); }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: één kolom voor de duim; zwarte balk met voortgang bovenaan, secties als rijen om aan te tikken. Zelfde wereld als de plattegrond: beton, zwart staal, gele leiding. */
:root {
  --bg: #f1f0ec;
  --card: #ffffff;
  --ink: #1e2023;
  --muted: #6d6c66;
  --line: #dcdbd5;
  --steel: #1e2023;
  --on-steel: #f1f0ec;
  --pipe: #d9a90f;
  --pipe-soft: #f6ebc4;
  --red: #c9372a;
  --green: #2c7d45;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151618; --card: #1f2023; --ink: #ecebe6; --muted: #9a9993; --line: #33353a;
  --steel: #0c0d0e; --on-steel: #ecebe6; --pipe: #e8bb2a; --pipe-soft: #3a3218; --red: #ef6a5a; --green: #5cbc7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151618; --card: #1f2023; --ink: #ecebe6; --muted: #9a9993; --line: #33353a;
  --steel: #0c0d0e; --on-steel: #ecebe6; --pipe: #e8bb2a; --pipe-soft: #3a3218; --red: #ef6a5a; --green: #5cbc7a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--steel); }
.gut { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--steel); color: var(--on-steel); }
.top .gut { padding-block: 12px 10px; display: grid; gap: 8px; }
.row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
h1 span { color: var(--pipe); }
.count { font-family: var(--display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: rgba(255,255,255,.14); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--pipe); transition: width .3s ease; }

main { padding-block: 14px 40px; display: grid; gap: 22px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink); font-weight: 500; }
.switch input { width: 18px; height: 18px; accent-color: var(--pipe); }
.note { margin: 0; font-size: 13.5px; color: var(--muted); }
.note.warn { color: var(--ink); background: var(--pipe-soft); border-radius: 6px; padding: 8px 10px; }

section { display: grid; gap: 8px; scroll-margin-top: 130px; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 3px solid var(--ink); padding-bottom: 4px; }
h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.sh .n { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sh .n.full { color: var(--green); }
h3 { margin: 8px 0 0; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.item { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 13px 14px; cursor: pointer; min-height: 52px; }
.item:focus-visible { outline: 3px solid var(--pipe); outline-offset: -3px; }
.box { flex: none; width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 5px; display: grid; place-content: center; margin-top: -1px; transition: background .15s ease; }
.box svg { width: 16px; height: 16px; opacity: 0; transform: scale(.6); transition: opacity .15s ease, transform .15s ease; }
.txt { display: grid; gap: 2px; min-width: 0; }
.t { font-weight: 500; line-height: 1.3; }
.d { font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.by { font-size: 12.5px; color: var(--green); font-weight: 600; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; background: var(--pipe-soft); color: var(--ink); border-radius: 3px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
.item[aria-pressed="true"] .box { background: var(--pipe); border-color: var(--pipe); }
.item[aria-pressed="true"] .box svg { opacity: 1; transform: none; }
.item[aria-pressed="true"] .t { text-decoration: line-through; text-decoration-color: var(--pipe); text-decoration-thickness: 2px; color: var(--muted); }
.item.crit .t::before { content: "!"; display: inline-grid; place-content: center; width: 17px; height: 17px; border-radius: 50%; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; margin-right: 7px; vertical-align: 1px; }
body.hide-done li:has(.item[aria-pressed="true"]) { display: none; }
.empty { display: none; padding: 14px; color: var(--green); font-weight: 600; font-size: 14px; }
body.hide-done .list:not(:has(.item[aria-pressed="false"])) .empty { display: block; }

/* helpers */
.crew { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
.axis, .lane { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; align-items: center; }
.axis .ticks { position: relative; height: 14px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis .ticks span { position: absolute; transform: translateX(-50%); }
.axis .ticks span:first-child { transform: none; }
.axis .ticks span:last-child { transform: translateX(-100%); }
.lane .who { font-size: 14px; font-weight: 500; line-height: 1.2; min-width: 0; }
.lane .who small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 14px; background: var(--bg); border-radius: 3px; }
.track .seg { position: absolute; top: 0; bottom: 0; background: var(--pipe); border-radius: 3px; }
.track .op { position: absolute; top: 0; bottom: 0; right: 0; width: 10%; background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 5px); opacity: .55; border-radius: 0 3px 3px 0; }
.lane.now-in .who { font-weight: 700; }
.lane.now-in .who::after { content: " · nu"; color: var(--green); font-weight: 600; }
.nowline { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--red); border-radius: 1px; }
.crewfoot { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.crewfoot i { display: inline-block; width: 16px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

/* contact */
details.fold > summary { list-style: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2::after, details.fold > summary h3::after { content: ""; display: inline-block; width: 8px; height: 8px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(45deg); margin-left: 10px; vertical-align: 4px; transition: transform .15s ease; }
details.fold > summary h3::after { width: 6px; height: 6px; border-width: 2px; vertical-align: 3px; }
details.fold:not([open]) > summary h2::after, details.fold:not([open]) > summary h3::after { transform: rotate(-45deg); vertical-align: 1px; }
details.fold > summary:focus-visible { outline: 3px solid var(--pipe); outline-offset: 3px; }
details.fold[open] > summary.sh { margin-bottom: 8px; }
.fbody { display: grid; gap: 8px; }
.gsum { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 6px 0 2px; }
.gsum h3 { margin: 0; }
.gn { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gn.full { color: var(--green); }
details.sub[open] > .gsum { margin-bottom: 6px; }
.contacts { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.contacts li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 11px 14px; }
.contacts li + li { border-top: 1px solid var(--line); }
.ci { display: grid; gap: 1px; min-width: 0; }
.ci .k { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ci .nm { font-weight: 600; }
.ci .num { font-size: 14.5px; font-variant-numeric: tabular-nums; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.ca { flex: none; display: flex; gap: 6px; }
.call { font: 700 15px var(--display); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; background: var(--steel); color: var(--on-steel); border-radius: 6px; padding: 9px 14px; }
.call.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.call:focus-visible { outline: 3px solid var(--pipe); outline-offset: 2px; }
.none { color: var(--muted); font-size: 13px; font-weight: 400; }
.contact { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; }
.contact .k { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.contact .v { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.contact .v span { user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.copy { font: 600 13px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
.copy:focus-visible { outline: 2px solid var(--pipe); outline-offset: 2px; }

.install { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center; background: var(--pipe-soft); border: 1px solid var(--pipe); border-radius: 8px; padding: 12px 14px; }
.install-txt { display: grid; gap: 2px; font-size: 14px; min-width: 0; }
.install-txt b { font-family: var(--display); font-size: 18px; text-transform: uppercase; letter-spacing: .02em; }
.installbtn { font: 700 16px var(--display); letter-spacing: .04em; text-transform: uppercase; background: var(--steel); color: var(--on-steel); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
.install .ios { grid-column: 1 / -1; margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px; }
.install .ios svg { width: 17px; height: 17px; vertical-align: -3px; }
.install .later { grid-column: 1 / -1; justify-self: start; font: 500 13px var(--body); color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.list li.own { display: flex; align-items: stretch; }
.list li.own .item { flex: 1; min-width: 0; }
.del { flex: none; min-width: 48px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); font: 500 22px var(--body); cursor: pointer; padding: 0 12px; }
.del.armed { background: var(--red); color: #fff; font-size: 13px; font-weight: 600; }
.del:focus-visible { outline: 3px solid var(--pipe); outline-offset: -3px; }
.addrow { padding: 8px 10px 8px 14px; background: var(--bg); }
.add { display: flex; gap: 8px; align-items: center; }
.add input { flex: 1; min-width: 0; font: 16px var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
.add input::placeholder { color: var(--muted); }
.add input:focus-visible { outline: 2px solid var(--pipe); outline-offset: 1px; border-color: var(--pipe); }
.add button { flex: none; font: 700 15px var(--display); letter-spacing: .04em; text-transform: uppercase; background: var(--steel); color: var(--on-steel); border: 0; border-radius: 6px; padding: 10px 12px; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.reset { justify-self: start; font: 500 14px var(--body); color: var(--red); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.confirm button { font: 600 14px var(--body); border-radius: 6px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.confirm .yes { background: var(--red); border-color: var(--red); color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--steel); color: var(--on-steel); font-size: 14px; padding: 9px 14px; border-radius: 6px; transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- app-weergave ---------- */
body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); overscroll-behavior-y: contain; }
.top .gut { padding-block: 10px 10px; }
.row1 { align-items: center; }
.row1 h1 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back, .phone { flex: none; display: grid; place-content: center; width: 38px; height: 38px; margin: -6px 0; border-radius: 50%; color: var(--on-steel); text-decoration: none; }
.back { margin-left: -10px; }
.back svg { width: 22px; height: 22px; }
.phone { background: var(--pipe); color: var(--steel); width: 34px; height: 34px; }
.phone svg { width: 18px; height: 18px; }
.back:focus-visible, .phone:focus-visible { outline: 2px solid var(--pipe); outline-offset: 2px; }
section.view > details.fold > summary.sh { display: none; }
#main { padding-block: 14px 28px; gap: 14px; }
#main.enter > .view:not([hidden]) { animation: enter .22s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bar-n { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); }

.start { display: grid; gap: 14px; }
.hero { display: flex; gap: 16px; align-items: center; background: var(--steel); color: var(--on-steel); border-radius: 12px; padding: 16px; }
.ring { position: relative; flex: none; width: 76px; height: 76px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .rb { stroke: rgba(255,255,255,.14); }
.ring .rf { stroke: var(--pipe); stroke-linecap: round; stroke-dasharray: 119.4; stroke-dashoffset: 119.4; transition: stroke-dashoffset .5s ease; }
.ring b { position: absolute; inset: 0; display: grid; place-content: center; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.hero-txt { display: grid; gap: 3px; min-width: 0; }
.hero-txt .eyebrow { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--pipe); }
.hero-txt strong { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; text-transform: uppercase; }
.hero-txt span:last-child { font-size: 13.5px; opacity: .75; line-height: 1.35; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "i n" "t t" "b b" "x x"; gap: 6px 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-decoration: none; color: var(--ink); min-height: 118px; -webkit-tap-highlight-color: transparent; transition: transform .1s ease; }
.card:active { transform: scale(.98); }
.card:focus-visible { outline: 3px solid var(--pipe); outline-offset: 2px; }
.card .ci { grid-area: i; width: 34px; height: 34px; border-radius: 9px; background: var(--pipe-soft); display: grid; place-content: center; }
.card .ci svg { width: 20px; height: 20px; }
.card .cn { grid-area: n; justify-self: end; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .cn.full { color: var(--green); }
.card .ct { grid-area: t; font-family: var(--display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.card .cbar { grid-area: b; height: 5px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.card .cbar i { display: block; height: 100%; width: 0; background: var(--pipe); transition: width .3s ease; }
.card[data-card="helpers"] .cbar, .card[data-card="contact"] .cbar { display: none; }
.card[data-card="contact"] { grid-column: 1 / -1; min-height: 0; grid-template-columns: auto 1fr auto; grid-template-areas: "i t n"; }
.card[data-card="contact"] .cnext { display: none; }
.card .cnext { grid-area: x; font-size: 12.5px; color: var(--muted); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; color: var(--muted); text-decoration: none; font-family: var(--display); font-weight: 600; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a.on { color: var(--ink); }
.tabs a.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--pipe); }
.tabs a:focus-visible { outline: 2px solid var(--pipe); outline-offset: -4px; }
.badge { position: absolute; top: 4px; left: calc(50% + 7px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--steel); color: var(--on-steel); font: 600 11px/17px var(--body); text-align: center; font-variant-numeric: tabular-nums; }
.badge:empty { display: none; }
.badge.full { background: var(--green); color: #fff; }
.tabs a[data-tab="start"] .badge { display: none; }
@media (max-width: 340px) { .cards { grid-template-columns: 1fr; } .tabs a span { font-size: 11px; } }
@media (prefers-reduced-motion: reduce) { #main.enter > .view:not([hidden]) { animation: none; } }
</style>
</head>
<body>

<div class="top">
  <div class="gut">
    <div class="row1">
      <a href="#start" class="back" id="back" aria-label="Terug naar start" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h1 id="vtitle">Personeels<span>feest</span></h1>
      <span class="count" id="count">0 / 0</span>
      <a href="#contact" class="phone" id="phone" aria-label="Contact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h3l1.5 4-2 1.3a11 11 0 0 0 6.1 6.1l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
  </div>
</div>

<main class="gut" id="main">
  <div class="view start" data-view="start" id="start">
    <div class="hero">
      <div class="ring" aria-hidden="true"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="rb"/><circle cx="22" cy="22" r="19" class="rf" id="ringf"/></svg><b id="ringpct">0%</b></div>

    return h + '</div></details></section>';

  function crewHTML() {
    const S = 8, E = 26, span = E - S;
    const pct = h => ((h - S) / span * 100).toFixed(2) + '%';
    const fmt = h => String(h % 24).padStart(2, '0') + 'h00';
    let h = `<section class="view" data-view="helpers" hidden id="helpers" aria-labelledby="h-helpers"><details class="fold" data-fold="helpers" open><summary class="sh"><h2 id="h-helpers">Helpers</h2><span class="n" id="nowtxt"></span></summary><div class="crew">
      <div class="axis"><span></span><div class="ticks"><span style="left:0">08</span><span style="left:${pct(12)}">12</span><span style="left:${pct(16)}">16</span><span style="left:${pct(20)}">20</span><span style="left:100%">02</span></div></div>`;
    CREW.forEach(([n, segs, op], i) => {
      const times = segs.length ? segs.map(([a, b]) => fmt(a) + '–' + fmt(b)).join(', ') + (op ? ' + opruim' : '') : 'uren nog niet bekend';

  }

    const btn = document.getElementById('i-' + id);

    const chain = [];
    let el = btn.closest('details.fold');
    while (el && el.classList.contains('sub')) { chain.push(el); el = el.parentElement.closest('details.fold'); }

      for (const d of chain) {
        const open = d.querySelectorAll('.item[aria-pressed="false"]').length;

        else break;

  const sectionKeys = sec => sec.groups.map((g, gi) => sec.id + '-' + gi);

  function mergeFixed() {
    const norm = t => String(t).toLowerCase().replace(/[^a-z0-9à-ÿ]+/g, ' ').trim();

    SECTIONS.forEach(sec => sec.groups.forEach(g => g.items.forEach(([id, t, d]) => {
      fixed[norm(t)] = id;
      if (d) fixed[norm(t + ' ' + d)] = id;
    })));
    let changed = false;
    Object.keys(custom).forEach(k => {
      custom[k] = custom[k].filter(x => {
        const n = norm(x.t);
        const hit = fixed[n];
        if (!hit) return true;
        if (state[x.id] && !state[hit]) state[hit] = state[x.id];
        delete state[x.id];
        changed = true;
        return false;
      });
      if (!custom[k].length) delete custom[k];
    });
    if (changed) { saveCustom(); saveLocal(); }

      if (s && (s.by || s.at)) {
        const who = '';
        const t = s.at ? new Date(s.at).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' }) : '';
        by.textContent = '✓ ' + [who, t].filter(Boolean).join(' · ');
        by.hidden = false;
      } else by.hidden = true;
      if (s) done++;
    });
    const prog = { start: [done, every.length] };
    SECTIONS.forEach(sec => {
      const ids = sec.groups.flatMap(g => g.items.map(x => x[0])).concat(sectionKeys(sec).flatMap(customIds));
      const n = ids.filter(id => state[id]).length;
      const lab = document.querySelector(`[data-n="${sec.id}"]`);
      lab.textContent = `${n} / ${ids.length}`;
      lab.classList.toggle('full', n === ids.length);
      prog[sec.id] = [n, ids.length];
      const full = n === ids.length;
      const bd = document.querySelector(`[data-badge="${sec.id}"]`);
      if (bd) { bd.textContent = full ? '✓' : String(ids.length - n); bd.classList.toggle('full', full); }
      document.querySelector(`[data-cn="${sec.id}"]`).textContent = full ? '✓ klaar' : `${n} / ${ids.length}`;
      document.querySelector(`[data-cn="${sec.id}"]`).classList.toggle('full', full);
      document.querySelector(`[data-cbar="${sec.id}"]`).style.width = (ids.length ? n / ids.length * 100 : 0) + '%';
      const nxt = ids.find(id => !state[id]);
      const nel = nxt && document.querySelector(`#i-${nxt} .t`);
      document.querySelector(`[data-cnext="${sec.id}"]`).textContent = full ? 'alles afgevinkt' : (nel ? 'Volgende: ' + nel.firstChild.textContent : '');
      sec.groups.forEach((g, gi) => {
        const key = sec.id + '-' + gi, gl = document.querySelector(`[data-gn="${key}"]`);
        if (!gl) return;
        const gids = g.items.map(x => x[0]).concat(customIds(key)), gn = gids.filter(id => state[id]).length;
        gl.textContent = gn === gids.length ? '✓ klaar' : `${gn} / ${gids.length}`;
        gl.classList.toggle('full', gn === gids.length);
      });
    });
    lastProg = prog;
    paintHeader();
  }

  let lastProg = {};
  function paintHeader() {
    const v = currentView;
    const pr = lastProg[v];
    const cnt = document.getElementById('count'), mt = document.getElementById('meter');
    if (pr) { cnt.textContent = `${pr[0]} / ${pr[1]}`; mt.style.width = (pr[1] ? pr[0] / pr[1] * 100 : 0) + '%'; cnt.hidden = false; mt.parentElement.hidden = false; }
    else { cnt.textContent = ''; cnt.hidden = true; mt.parentElement.hidden = true; }
    document.getElementById('listn').textContent = pr && v !== 'start' ? (pr[0] === pr[1] ? 'Alles afgevinkt' : `Nog ${pr[1] - pr[0]} te doen`) : '';
    const st = lastProg.start || [0, 0], pct = st[1] ? Math.round(st[0] / st[1] * 100) : 0;
    document.getElementById('ringpct').textContent = pct + '%';
    const rf = document.getElementById('ringf'); rf.style.strokeDashoffset = String(119.4 * (1 - pct / 100)); rf.style.opacity = pct ? '1' : '0';
    document.getElementById('herotxt').textContent = st[0] === st[1] ? 'Alles is afgevinkt' : `Nog ${st[1] - st[0]} van ${st[1]} te doen`;
    const busyList = SECTIONS.filter(x => lastProg[x.id] && lastProg[x.id][0] < lastProg[x.id][1]).map(x => x.title.replace('?', '').toLowerCase());
    document.getElementById('herosub').textContent = busyList.length ? 'Open: ' + busyList.join(', ') : '';
  }

  async function resolveNames() {
    if (!user) return;
    const ids = [...new Set(Object.values(state).map(s => s.by).filter(Boolean))].filter(id => !(id in names));
    if (!ids.length) return;
    try {
      const ps = await user.profiles(ids);
      ids.forEach(id => { names[id] = (ps[id] && ps[id].name) ? ps[id].name.split(' ')[0] : ''; });
      render();
    } catch (e) {}
  }

  function loadLocal() { try { state = JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { state = {}; } }
  function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch (e) {} }

  const toastEl = document.getElementById('toast');
  let tt;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 2600); }

  const busy = new Set();
  async function toggle(id) {
    if (busy.has(id)) return;
    const was = state[id];
    if (was) delete state[id]; else state[id] = { by: me || '', at: new Date().toISOString() };
    render();
    if (!was) autoClose(id);
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    if (!db) { saveLocal(); return; }
    busy.add(id);
    try {
      const ref = db.collection('vinkjes').doc(id);
      if (was) await ref.delete(); else await ref.set({ by: me || '', at: state[id].at });
    } catch (e) {
      if (was) state[id] = was; else delete state[id];
      render();
      toast('Niet opgeslagen. Je hebt misschien geen schrijfrechten op deze app.');
    } finally { busy.delete(id); }
  }

  main.addEventListener('submit', e => {
    const f = e.target.closest('form.add');
    if (!f) return;
    e.preventDefault();
    const inp = f.querySelector('input');
    const t = inp.value.trim().replace(/\s+/g, ' ');
    if (!t) { inp.focus(); return; }
    const key = f.dataset.add;
    const id = 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    (custom[key] = custom[key] || []).push({ id, t });
    saveCustom(); drawCustom(); render();
    inp.value = '';
    inp.focus();
    toast('Toegevoegd');
  });

  let armed = null, armTimer;
  function removeCustom(id) {
    Object.keys(custom).forEach(k => {
      custom[k] = custom[k].filter(x => x.id !== id);
      if (!custom[k].length) delete custom[k];
    });
    delete state[id];
    saveCustom(); saveLocal(); drawCustom(); render();
    toast('Verwijderd');
  }

  main.addEventListener('click', e => {
    const del = e.target.closest('.del');
    if (del) {
      const id = del.dataset.del;
      if (armed === id) { armed = null; clearTimeout(armTimer); removeCustom(id); return; }
      document.querySelectorAll('.del.armed').forEach(x => { x.classList.remove('armed'); x.textContent = '×'; });
      armed = id; del.classList.add('armed'); del.textContent = 'Verwijder?';
      clearTimeout(armTimer);
      armTimer = setTimeout(() => { armed = null; del.classList.remove('armed'); del.textContent = '×'; }, 3500);
      return;
    }
    const b = e.target.closest('.item');
    if (b) toggle(b.dataset.id);
    const c = e.target.closest('.copy');
    if (c) {
      const v = c.dataset.copy;
      try {
        navigator.clipboard.writeText(v).then(() => toast('Gekopieerd'), () => selectNear(c));
      } catch (err) { selectNear(c); }
    }
  });
  function selectNear(btn) {
    const span = btn.parentElement.querySelector('span');
    const r = document.createRange(); r.selectNodeContents(span);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast('Geselecteerd, kopieer met je toestel');
  }

  // verberg afgevinkt (per toestel)
  const hide = document.getElementById('hide');
  try { hide.checked = localStorage.getItem('feestdag-verberg') === '1'; } catch (e) {}
  document.body.classList.toggle('hide-done', hide.checked);
  hide.addEventListener('change', () => {
    document.body.classList.toggle('hide-done', hide.checked);
    try { localStorage.setItem('feestdag-verberg', hide.checked ? '1' : '0'); } catch (e) {}
  });

  // alles wissen, met bevestiging in de pagina
  const rw = document.getElementById('resetwrap');
  function showReset() {
    rw.innerHTML = '<button class="reset" type="button" id="reset">Alle vinkjes wissen</button>';
    document.getElementById('reset').addEventListener('click', () => {
      rw.innerHTML = '<div class="confirm">Alle vinkjes op dit toestel wissen? <button class="yes" type="button" id="ry">Ja, wis alles</button><button type="button" id="rn">Annuleer</button></div>';
      document.getElementById('rn').addEventListener('click', showReset);
      document.getElementById('ry').addEventListener('click', async () => {
        const ids = Object.keys(state);
        state = {}; render(); showReset();
        if (!db) { saveLocal(); toast('Alles gewist'); return; }
        try { for (const id of ids) await db.collection('vinkjes').doc(id).delete(); toast('Alles gewist'); }
        catch (e) { toast('Niet alles kon gewist worden.'); }
      });
    });
  }
  showReset();

  // ---------- schermen ----------
  let currentView = 'start';
  const scrollPos = {};
  const VIEWS = ['start'].concat(SECTIONS.map(x => x.id), ['helpers', 'contact']);
  const TITLES = Object.fromEntries(SECTIONS.map(x => [x.id, x.title]).concat([['helpers', 'Helpers'], ['contact', 'Contact']]));
  function showView(v, fromHash) {
    if (!VIEWS.includes(v)) v = 'start';
    scrollPos[currentView] = window.scrollY;
    currentView = v;
    document.querySelectorAll('#main > .view').forEach(el => { el.hidden = el.dataset.view !== v; });
    const isList = SECTIONS.some(x => x.id === v);
    document.getElementById('listbar').hidden = !isList;
    document.getElementById('back').hidden = v === 'start';
    document.getElementById('phone').hidden = v === 'contact';
    const h1 = document.getElementById('vtitle');
    if (v === 'start') h1.innerHTML = 'Personeels<span>feest</span>'; else h1.textContent = TITLES[v];
    document.title = v === 'start' ? 'Personeelsfeest' : TITLES[v] + ' · Personeelsfeest';
    document.querySelectorAll('[data-tab]').forEach(a => {
      const on = a.dataset.tab === v;
      a.classList.toggle('on', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    const main = document.getElementById('main');
    main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter');
    window.scrollTo(0, scrollPos[v] || 0);
    paintHeader();
  }
  window.addEventListener('hashchange', () => showView(location.hash.slice(1), true));
  const now = new Date();
  document.getElementById('today').textContent = now.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });

  // ---------- opslaan op dit toestel ----------
  const sync = document.getElementById('sync');
  loadLocal(); loadCustom(); mergeFixed(); drawCustom(); render();
  sync.textContent = '';
  showView(location.hash.slice(1) || 'start');
  window.addEventListener('storage', e => { if (e.key === LKEY) { loadLocal(); render(); } if (e.key === CKEY) { loadCustom(); drawCustom(); render(); } });

  // ---------- installeren ----------
  const inst = document.getElementById('install'), ibtn = document.getElementById('installbtn'), ios = document.getElementById('ios');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let dismissed = false;
  try { dismissed = localStorage.getItem('feestdag-install-later') === '1'; } catch (e) {}
  let deferred = null;
  if (!standalone && !dismissed && isIOS) inst.hidden = false;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (!standalone && !dismissed) inst.hidden = false;
  });
  ibtn.addEventListener('click', async () => {
    if (deferred) {
      deferred.prompt();
      try { const r = await deferred.userChoice; if (r.outcome === 'accepted') inst.hidden = true; } catch (e) {}
      deferred = null;
    } else {
      ios.hidden = !ios.hidden;
    }
  });
  window.addEventListener('appinstalled', () => { inst.hidden = true; toast('App geïnstalleerd'); });
  document.getElementById('later').addEventListener('click', () => {
    inst.hidden = true;
    try { localStorage.setItem('feestdag-install-later', '1'); } catch (e) {}
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
